<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truthful Micro Gap Sketch Prototype</title>
    <style>
        :root {
            --w: 1920px;
            --h: 980px;
            --axis-left: 140px;
            --axis-top: 510px;
            --axis-width: 1640px;
            --blue: #0072bd;
            --orange: #d95319;
            --text: #10161d;
            --muted: #5d6672;
            --bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: var(--w);
            height: var(--h);
            margin: 0;
            background: var(--bg);
            font-family: "Segoe UI", "Malgun Gothic", sans-serif;
            overflow: hidden;
        }

        svg {
            width: var(--w);
            height: var(--h);
            display: block;
        }

        .title {
            font-size: 34px;
            font-weight: 700;
            fill: var(--text);
        }

        .sub {
            font-size: 18px;
            fill: var(--muted);
        }

        .axis-label {
            font-family: "Bahnschrift", "Segoe UI", sans-serif;
            font-size: 17px;
            fill: var(--text);
            letter-spacing: 0.04em;
        }

        .gap-label {
            font-family: "Bahnschrift", "Segoe UI", sans-serif;
            font-size: 30px;
            font-weight: 700;
            fill: var(--orange);
            text-anchor: middle;
        }

        .small-gap-label {
            font-family: "Bahnschrift", "Segoe UI", sans-serif;
            font-size: 24px;
            font-weight: 700;
            fill: var(--orange);
            text-anchor: middle;
        }

        .time-label {
            font-family: "Consolas", monospace;
            font-size: 22px;
            fill: var(--muted);
            text-anchor: middle;
        }

        .stack-label {
            font-family: "Consolas", monospace;
            font-size: 22px;
            fill: var(--text);
            text-anchor: middle;
        }

        .note {
            font-size: 17px;
            fill: var(--muted);
        }
    </style>
</head>
<body>
    <svg id="svg" viewBox="0 0 1920 980" preserveAspectRatio="xMinYMin meet">
        <defs>
            <marker id="arrow-end" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
                <path d="M 0 0 L 14 7 L 0 14" fill="none" stroke="#d95319" stroke-width="1.8"/>
            </marker>
            <marker id="arrow-start" markerWidth="14" markerHeight="14" refX="3" refY="7" orient="auto">
                <path d="M 14 0 L 0 7 L 14 14" fill="none" stroke="#d95319" stroke-width="1.8"/>
            </marker>
        </defs>
    </svg>
    <script>
        const svg = document.getElementById("svg");
        const ns = "http://www.w3.org/2000/svg";
        const axisLeft = 140;
        const axisTop = 510;
        const axisWidth = 1640;
        const times = [200.64, 213.13, 213.14, 221.71];
        const span = times[times.length - 1] - times[0];

        function add(name, attrs = {}, text = "") {
            const el = document.createElementNS(ns, name);
            Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
            if (text) {
                el.textContent = text;
            }
            svg.appendChild(el);
            return el;
        }

        function xFor(t) {
            return axisLeft + (((t - times[0]) / span) * axisWidth);
        }

        const actualX = times.map(xFor);
        const actualMicroMid = (actualX[1] + actualX[2]) / 2;
        const helperGap = 12;
        const helperLeft = actualMicroMid - (helperGap / 2);
        const helperRight = actualMicroMid + (helperGap / 2);

        add("text", { x: 96, y: 90, class: "title" }, "Prototype B / Sketch-Aligned Micro Gap");
        add("text", { x: 96, y: 130, class: "sub" }, "Large spans stay readable on the same rail, while the 0.01s zone is rendered as a visibly separated tick pair with stacked labels below.");
        add("text", { x: 96, y: 158, class: "sub" }, "This follows the hand sketch structure: top arrows, central micro pair, and bottom vertical stacking.");

        add("rect", {
            x: 1360,
            y: 68,
            width: 450,
            height: 116,
            rx: 18,
            fill: "#f8fafc",
            stroke: "#a8b5c1",
            "stroke-width": 1.2
        });
        add("text", { x: 1390, y: 108, class: "note" }, "Main axis width: 1640px");
        add("text", { x: 1390, y: 138, class: "note" }, "Actual 0.01s width: about 0.78px");
        add("text", { x: 1390, y: 168, class: "note" }, "Displayed helper gap: 12px");

        add("line", {
            x1: axisLeft,
            y1: axisTop,
            x2: axisLeft + axisWidth,
            y2: axisTop,
            stroke: "#0072bd",
            "stroke-width": 6,
            "stroke-linecap": "round"
        });
        add("text", { x: axisLeft + axisWidth + 28, y: axisTop + 7, class: "axis-label" }, "t [s]");

        add("line", {
            x1: actualX[0],
            y1: 404,
            x2: helperLeft,
            y2: 404,
            stroke: "#d95319",
            "stroke-width": 2,
            "marker-start": "url(#arrow-start)",
            "marker-end": "url(#arrow-end)"
        });
        add("text", { x: (actualX[0] + helperLeft) / 2, y: 372, class: "gap-label" }, "12.49s");

        add("line", {
            x1: helperRight,
            y1: 404,
            x2: actualX[3],
            y2: 404,
            stroke: "#d95319",
            "stroke-width": 2,
            "marker-start": "url(#arrow-start)",
            "marker-end": "url(#arrow-end)"
        });
        add("text", { x: (helperRight + actualX[3]) / 2, y: 372, class: "gap-label" }, "8.57s");

        add("line", {
            x1: helperLeft,
            y1: 320,
            x2: helperRight,
            y2: 320,
            stroke: "#d95319",
            "stroke-width": 2,
            "marker-start": "url(#arrow-start)",
            "marker-end": "url(#arrow-end)"
        });
        add("text", { x: (helperLeft + helperRight) / 2, y: 290, class: "small-gap-label" }, "0.01s");

        actualX.forEach((px, index) => {
            if (index === 1 || index === 2) {
                return;
            }

            add("line", {
                x1: px,
                y1: axisTop - 26,
                x2: px,
                y2: axisTop + 28,
                stroke: "#111111",
                "stroke-width": 2
            });
            add("text", { x: px, y: axisTop + 80, class: "time-label" }, times[index].toFixed(2));
        });

        add("line", {
            x1: helperLeft,
            y1: axisTop - 28,
            x2: helperLeft,
            y2: axisTop + 24,
            stroke: "#111111",
            "stroke-width": 2.3
        });
        add("line", {
            x1: helperRight,
            y1: axisTop - 28,
            x2: helperRight,
            y2: axisTop + 24,
            stroke: "#111111",
            "stroke-width": 2.3
        });

        add("line", {
            x1: helperLeft,
            y1: axisTop - 28,
            x2: actualX[1],
            y2: axisTop - 10,
            stroke: "#d95319",
            "stroke-width": 1.5
        });
        add("line", {
            x1: helperRight,
            y1: axisTop - 28,
            x2: actualX[2],
            y2: axisTop - 10,
            stroke: "#d95319",
            "stroke-width": 1.5
        });

        add("line", {
            x1: helperLeft,
            y1: axisTop + 24,
            x2: helperLeft,
            y2: 590,
            stroke: "#111111",
            "stroke-width": 1.7
        });
        add("line", {
            x1: helperRight,
            y1: axisTop + 24,
            x2: helperRight,
            y2: 646,
            stroke: "#111111",
            "stroke-width": 1.7
        });
        add("text", { x: helperLeft, y: 624, class: "stack-label" }, "213.13");
        add("text", { x: helperRight, y: 680, class: "stack-label" }, "213.14");

        add("text", { x: helperLeft - 58, y: 648, class: "note" }, "stack 1");
        add("text", { x: helperRight - 58, y: 704, class: "note" }, "stack 2");
    </script>
</body>
</html>
