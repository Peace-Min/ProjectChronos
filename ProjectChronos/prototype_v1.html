<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 마커 가시성 개선 프로토타입</title>
    <style>
        :root {
            --bg-color: #1a1a1b;
            --panel-bg: #2d2d2e;
            --accent-color: #007acc;
            --high-priority: #ff5555;
            --medium-priority: #ffb86c;
            --text-primary: #ffffff;
            --text-secondary: #999999;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 1000px;
            background: var(--panel-bg);
            padding: 80px 60px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            margin-top: 50px;
        }

        .header {
            margin-bottom: 60px;
            border-left: 4px solid var(--accent-color);
            padding-left: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 8px;
        }

        .timeline-container {
            position: relative;
            height: 200px; /* 레이블이 쌓일 높이 확보 */
            width: 100%;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .timeline-track {
            position: absolute;
            bottom: 40px; /* 트랙을 아래쪽에 배치 */
            left: 20px;
            right: 20px;
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        .marker {
            position: absolute;
            bottom: 32px; /* 트랙 중심에 맞춤 */
            width: 4px;
            height: 20px;
            background: var(--high-priority);
            border-radius: 2px;
            transform: translateX(-50%);
            z-index: 10;
        }

        .marker.medium {
            background: var(--medium-priority);
        }

        /* 레이블 컨테이너 */
        .marker-label {
            position: absolute;
            bottom: 60px; /* 기본 높이 */
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            border-left: 3px solid var(--accent-color);
            z-index: 20;
        }

        .time-tag {
            color: var(--accent-color);
            font-weight: bold;
            margin-right: 8px;
            font-family: 'Consolas', monospace;
        }

        /* 레이블과 마커를 잇는 선 */
        .connecting-line {
            position: absolute;
            bottom: 40px; /* 트랙 위치 */
            left: 50%;
            width: 1px;
            background: rgba(255,255,255,0.2);
            transform: translateX(-50%);
            z-index: 5;
        }

        .legend {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Event Interaction Stacking Prototype</h1>
            <p class="subtitle">WPF EventMarkerPanel 기반 동적 스태킹 레이아웃 시뮬레이션</p>
        </div>
        
        <div id="timeline" class="timeline-container">
            <div class="timeline-track"></div>
            <!-- 마커들이 여기에 동적으로 생성됨 -->
        </div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: var(--high-priority)"></div> High Priority</div>
            <div class="legend-item"><div class="dot" style="background: var(--medium-priority)"></div> Medium Priority</div>
            <div class="legend-item">💡 마커가 근접하면 레이블이 자동으로 위로 쌓입니다.</div>
        </div>
    </div>

    <script>
        const events = [
            { t: 40.0, p: 'High', title: '위험 상황 발생' },
            { t: 80.0, p: 'Medium', title: '시스템 부하 상승' },
            { t: 80.1, p: 'High', title: '네트워크 지연' },
            { t: 220.0, p: 'Medium', title: '시뮬레이션 종료' }
        ];

        const timeline = document.getElementById('timeline');
        const timelineWidth = timeline.offsetWidth - 40; // 좌우 여백 제외
        const duration = 250; // 전체 시간 범위

        // 레벨별 점유 공간 관리 (x_start, x_end)
        const levels = []; 

        function getX(time) {
            return (time / duration) * timelineWidth + 20;
        }

        events.forEach(event => {
            const x = getX(event.t);
            
            // 1. 마커 생성
            const marker = document.createElement('div');
            marker.className = `marker ${event.p.toLowerCase()}`;
            marker.style.left = `${x}px`;
            timeline.appendChild(marker);

            // 2. 적절한 레벨 찾기 (간단한 시간차 기반 필터링)
            // 실제 패널에선 ActualWidth 기반으로 더 정밀하게 계산함
            let level = 0;
            if (event.t > 0) {
                // 이전 이벤트들과 비교하여 겹치는지 확인
                // 이 프로토타입에선 인덱스로 단순화
            }
            
            // 시각적 테스트를 위해 80.0s와 80.1s 강제 스태킹
            if (event.t === 80.0) level = 1;
            if (event.t === 80.1) level = 2;

            // 3. 레이블 생성
            const labelHeight = 35; // 한 층의 높이
            const baseBottom = 60; // 기본 높이
            
            const label = document.createElement('div');
            label.className = 'marker-label';
            label.innerHTML = `<span class="time-tag">${event.t.toFixed(1)}s</span>${event.title}`;
            label.style.left = `${x}px`;
            label.style.bottom = `${baseBottom + (level * labelHeight)}px`;
            label.style.borderLeftColor = event.p === 'High' ? 'var(--high-priority)' : 'var(--medium-priority)';
            timeline.appendChild(label);

            // 4. 연결선 생성
            const line = document.createElement('div');
            line.className = 'connecting-line';
            line.style.left = `${x}px`;
            line.style.height = `${baseBottom + (level * labelHeight) - 40}px`;
            timeline.appendChild(line);
        });
    </script>
</body>
</html>
